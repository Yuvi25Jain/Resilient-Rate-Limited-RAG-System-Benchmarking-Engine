[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vaani-relay-rag"
version = "0.1.0"
description = "Resilient Rate-Limited RAG System with Strict Citations and Groq API Simulator"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
groq = ">=0.9.0"
chromadb = ">=0.4.24"
pypdf = ">=4.0.0"
sentence-transformers = ">=2.5.0"
rank-bm25 = ">=0.2.2"
tiktoken = ">=0.6.0"
pydantic = ">=2.0.0"
python-dotenv = ">=1.0.0"
