[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaani-relay-rag"
version = "0.1.0"
description = "Resilient Rate-Limited RAG System with Strict Citations and Groq API Simulator"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "groq>=0.9.0",
    "chromadb>=0.4.24",
    "pypdf>=4.0.0",
    "sentence-transformers>=2.5.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]